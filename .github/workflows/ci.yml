name: CI

on:
  push:
  pull_request:

# Nothing in CI can reach Part 1's warehouse, so every job runs against the
# synthetic fixture in tests/fixtures/gold via GOLD_SNAPSHOT_DIR. That is also
# the point: it proves a fresh clone works with no real data and no database.
env:
  GOLD_SNAPSHOT_DIR: tests/fixtures/gold

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Run tests
        run: uv run pytest -q

      # The metrics layer, built and tested against the fixture. This is the step
      # that proves the models survive every trap in CLAUDE.md §5: the fixture
      # carries an AWARDED match inside a completed season, a POSTPONED one with a
      # phantom 0-0, and both halves of a duplicated fixture, so a model that gets
      # the status or duplicate filter wrong fails here rather than in a chart.
      - name: dbt build (on the fixture)
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      # The fixture is committed, so it can go stale against the contract while
      # the tests it feeds keep passing. Rebuilding it and diffing proves the
      # committed Parquet is what the generator actually produces.
      - name: Fixture is up to date with the contract
        run: |
          uv run python tests/fixtures/make_gold_fixture.py
          if ! git diff --quiet -- tests/fixtures/gold; then
            echo "::error::The committed fixture differs from the generator's output."
            echo "Re-run: uv run python tests/fixtures/make_gold_fixture.py"
            git --no-pager diff --stat -- tests/fixtures/gold
            exit 1
          fi

  notebooks:
    # Committed outputs are what a reviewer reads on GitHub, and a notebook that
    # no longer runs is worse than no notebook. This re-executes every one
    # against the fixture; it does not compare outputs, because the fixture's
    # numbers are not the real snapshot's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # The analyses read the marts, not the snapshot, so the metrics layer has to
      # exist before a notebook can open it. `marts.open_marts()` refuses a database
      # that is out of date with the snapshot, which is exactly what an un-built or
      # stale one would be here.
      - name: Build the metrics layer
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Execute every notebook
        run: |
          uv run python - <<'PY'
          import sys
          from pathlib import Path

          import nbformat
          from nbclient import NotebookClient

          failed = []
          for path in sorted(Path("notebooks").glob("*.ipynb")):
              print(f"--- executing {path}", flush=True)
              nb = nbformat.read(path, as_version=4)
              try:
                  NotebookClient(
                      nb,
                      timeout=900,
                      kernel_name="python3",
                      resources={"metadata": {"path": str(path.parent)}},
                  ).execute()
              except Exception as exc:  # noqa: BLE001 - report all, fail once
                  print(f"::error file={path}::{type(exc).__name__}: {exc}")
                  failed.append(path)

          if failed:
              print(f"{len(failed)} notebook(s) failed to execute")
              sys.exit(1)
          print("all notebooks executed")
          PY

  dashboard:
    # The static site, built from the fixture and loaded in a real browser. Its own
    # job because downloading Chromium is slow and nothing else needs it.
    #
    # This is the only test that catches what this site can actually get wrong — a
    # renamed JSON key, a selector typo, a module that throws on load. None of those
    # fail ruff, and none of them fail a dbt test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # Both engines: the one reader-reported breakage came from Firefox while the
      # suite ran Chromium alone. --with-deps installs the system libraries they need,
      # which the GitHub runner allows and a developer machine often does not; locally
      # the smoke tests skip themselves rather than fail when a browser cannot start.
      - name: Install browsers
        run: uv run playwright install --with-deps chromium firefox

      - name: Build the metrics layer
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Export the dashboard's JSON
        run: uv run python scripts/export_site_data.py

      - name: Smoke-test the dashboard
        run: uv run pytest tests/test_site.py -q
