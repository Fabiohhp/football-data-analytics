version: 2

models:
  - name: int_team_matches
    description: |
      **Grain: one row per team per counting match** (`team_key` × `match_key`) —
      two rows per fixture, one from each side's point of view.

      This is the foundation of every team metric (CLAUDE.md §6). A league table is
      a `GROUP BY team_key, season, competition_code` over it; form is a window
      function over it; home advantage is a `GROUP BY is_home`. Nothing downstream
      re-applies the two filters that define "counting" — `status IN ('FINISHED',
      'AWARDED')` and `football_data_match_id IS NOT NULL` — and no mart may widen
      them, which is what the tests below are for.

      It is tested two ways on purpose, because the two catch different mistakes.
      `assert_int_team_matches_two_rows_per_counting_match` catches a lost or
      duplicated row. `assert_completed_seasons_have_full_fixture_lists` catches a
      *wrong filter* — the row count is internally consistent either way, but only
      the second notices that six clubs are suddenly one match short of a full
      season.
    tests:
      - unique_combination:
          arguments:
            columns: [team_key, match_key]
    columns:
      - name: match_key
        description: The fixture. Appears exactly twice, once per side.
        tests: [not_null]
      - name: team_key
        description: The club this row is about.
        tests: [not_null]
      - name: opponent_key
        description: The other club. `count(distinct opponent_key)` per club-season is half a complete fixture list.
        tests: [not_null]
      - name: is_home
        description: Whether this club was at home. The basis of the home-advantage analysis (§8 question 3).
        tests: [not_null]
      - name: season
        description: "`'YYYY/YY'`, carried from `fact_matches`."
        tests: [not_null]
      - name: competition_code
        description: |
          One of `PL`, `PD`, `BL1`, `SA`, `FL1`. Never null here: the rows with no
          competition code are the Understat halves of duplicated fixtures, and the
          `football_data_match_id` filter has already removed them. That is also why
          `not_null` belongs on this column and not on `stg_matches`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PL", "PD", "BL1", "SA", "FL1"]
      - name: goals_for
        description: |
          Goals this club scored. `not_null` is deliberate: Gold permits a null score
          for an unplayed fixture, none exist in the current snapshot, and a future
          one arriving here should fail the build rather than be scored as a 0-0
          defeat (CLAUDE.md §12 — where a trap's count is currently zero, the models
          test that it stays zero).
        tests: [not_null]
      - name: goals_against
        tests: [not_null]
      - name: points
        description: 3 / 1 / 0, derived from the scoreline in this row so that AWARDED matches are scored correctly.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 3]
                quote: false
      - name: xg_for
        description: |
          Understat expected goals for this club in this match. **Nullable, and never
          coalesced** (§5 trap 7): null means the sources did not pair the match, and
          the marts report how many matches their xG covers.
      - name: xg_against
        description: Expected goals conceded. Null exactly when `xg_for` is null — the two arrive as a pair.
      - name: xg_difference
        description: "`xg_for - xg_against`. Null when the match has no xG."
      - name: npxg_for
        description: Non-penalty expected goals for this club, as Understat reports it at match level.
      - name: ppda
        description: |
          Passes allowed per defensive action **by this club** — its own pressing
          intensity. **Lower means more pressing** (§5 trap 12). Null slightly more
          often than xG, so the marts count its coverage separately.
      - name: opponent_ppda
        description: The opponent's PPDA in the same match, i.e. how hard this club was pressed.
      - name: xpts
        description: Understat's expected points for this club in this match (§5 trap 12).
      - name: deep_for
        description: Understat "deep" passes completed by this club — passes into the area around the box.

  - name: int_club_seasons
    description: |
      **Grain: one club per season** (`team_key` × `season`), with the competition
      it played in.

      Exists because `competition_code` is NULL on the Understat half of every
      split fixture (§5 trap 13), and the player events and shots of those fixtures
      hang off exactly that half. Reading a league off the match would leave 368
      player rows and 307 shots without one, and **33 player-seasons with no league
      at all**. A club plays one competition per season — 0 of 288 club-seasons
      span two — so its own counting matches answer the question for every row.
    tests:
      - unique_combination:
          arguments:
            columns: [team_key, season]
    columns:
      - name: team_key
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: competition_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PL", "PD", "BL1", "SA", "FL1"]

  - name: int_shots
    description: |
      **Grain: one row per distinct shot** (`shot_key` survives; duplicates are
      dropped), with the match, season and competition attached.

      Deduplicated here rather than in `mart_shots` because `int_player_matches`
      needs the same rows to build npxG from, and the same calculation may not
      exist twice (CLAUDE.md §4). 93,988 rows from 94,034 in Gold — the 46
      difference is §5 trap 14.

      Duplicates are matched on the *shape* of a shot, using `understat_match_id`
      rather than the documented `match_key`: `match_key` is nullable, SQL groups
      NULLs together, and a `match_key`-based dedup would therefore treat shots
      from two different unmatched matches as copies of each other.
    tests:
      - unique_combination:
          arguments:
            columns: [shot_key]
    columns:
      - name: shot_key
        tests: [unique, not_null]
      - name: understat_match_id
        description: Non-null on every shot, which is why the joins upstream and downstream use it rather than `match_key` (§5 trap 4).
        tests: [not_null]
      - name: understat_player_id
        description: The durable player key, resolved from `player_key` (§5 trap 1).
        tests: [not_null]
      - name: season
        description: From the shot's match. Null only if the shot's match is not in the snapshot — zero rows today.
      - name: competition_code
        description: From `int_club_seasons`, not from the match, so a split fixture's shots still carry a league.
      - name: is_goal
        description: "`result = 'Goal'`. Excludes own goals deliberately: an `OwnGoal` row sits on the scorer's own team and is a goal for the opponent (§5 trap 11)."
        tests: [not_null]
      - name: is_penalty
        description: "`situation = 'Penalty'`. The basis of every npxG figure in the project (§5 trap 8)."
        tests: [not_null]

  - name: int_player_matches
    description: |
      **Grain: one row per player per match** (`player_event_key`), 1:1 with
      `stg_player_events` — every row survives, no filter, all joins LEFT.

      Adds the two things Understat's player line does not carry: a season, and
      everything non-penalty. npxG has to be built from the shots because there is
      no non-penalty xG per player anywhere in Gold (§5 trap 8).

      **It does not apply the league-table filters.** A player's goals live on the
      Understat half of a split fixture, so `football_data_match_id IS NOT NULL`
      would lose a goal or two a season — Retegui reads 25 here and would read 24
      with it. That is the opposite choice from `int_team_matches`, taken
      deliberately and stated in both places (§5 trap 13).

      Two cross-source invariants hold exactly, and are tested rather than assumed:
      the reported shot count equals the shot rows minus own goals, and
      `fact_player_events.xg` equals the summed shot xG to within 0.0002.
    tests:
      - unique_combination:
          arguments:
            columns: [player_event_key]
    columns:
      - name: player_event_key
        tests: [unique, not_null]
      - name: understat_player_id
        description: Aggregate by this, never by `player_key` (§5 trap 1).
        tests: [not_null]
      - name: team_key
        description: The club the player turned out for **in this match** (§5 trap 2).
        tests: [not_null]
      - name: season
        description: Derived in staging from the row's own `match_date`, so an orphan row keeps its season (§5 traps 4 and 5).
        tests: [not_null]
      - name: competition_code
        description: |
          From `int_club_seasons`. Nullable in principle — a club-season with no
          counting matches would leave it empty — and non-null for every row today.
      - name: np_goals
        description: Goals from non-penalty shots. Excludes own goals, which are a different `result` value entirely (§5 trap 11).
        tests: [not_null]
      - name: npxg
        description: Expected goals from non-penalty, non-own-goal shots — the denominator that matches `np_goals`.
        tests: [not_null]
      - name: shots_deduplicated
        description: |
          Shot rows for this player in this match, own goals excluded, duplicates
          removed. Equals Understat's own `shots` column exactly, on all 115,410
          rows.
        tests: [not_null]
      - name: shot_xg
        description: |
          Summed xG over **all** this player's shot rows in the match, own goals
          included — the figure that reconciles with `fact_player_events.xg`.
          Including them costs nothing: every own goal carries exactly 0.0000 xG.
        tests: [not_null]
