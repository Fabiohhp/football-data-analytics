version: 2

models:
  - name: mart_team_season
    description: |
      **Grain: one club per league-season** (`team_key` × `season` ×
      `competition_code`). The league table, plus the expected-goals columns that
      question 1 of CLAUDE.md §8 is answered from.

      Built entirely from `int_team_matches`, so the status and duplicate-fixture
      filters are already applied and no notebook or dashboard page re-applies them.
      Reconciles against the real world: 2024/25's final tables are exact in all five
      leagues — Liverpool 84, Barcelona 88, Napoli 82, Bayern 82, PSG 84 — with
      correct goal differences.

      **Read the coverage columns before the xG columns.** `matches_with_xg`,
      `matches_with_xpts` and `matches_with_ppda` say how many of `played` each set
      of figures actually covers, because a null is a match the two sources never
      paired and is excluded rather than zeroed (§5 trap 7).
    tests:
      - unique_combination:
          arguments:
            columns: [team_key, season, competition_code]
    columns:
      - name: team_key
        tests: [not_null]
      - name: team_name
        description: The conformed club name from `dim_teams`, ready to display.
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: competition_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PL", "PD", "BL1", "SA", "FL1"]
      - name: played
        description: |
          Counting matches, i.e. `FINISHED` or `AWARDED` and holding a Football-Data
          id. In a completed season this equals `scheduled_per_team`, which
          `assert_completed_seasons_have_full_fixture_lists` checks.
        tests: [not_null]
      - name: won
        description: Matches with 3 points. `won + drawn + lost = played`, tested by `assert_results_add_up_to_played`.
      - name: points
        description: The league table's points column. 3 / 1 / 0, from the scoreline.
        tests: [not_null]
      - name: points_per_match
        description: Points divided by `played` — the only fair comparison when one of the seasons involved is still in progress.
      - name: table_position
        description: |
          1 = top. Ordered by points, then goal difference, then goals scored, then
          `team_key` so the order is stable between runs. **La Liga and Serie A break
          ties on head-to-head results first**, which Gold carries no aggregate for,
          so a position here can differ from the official table where two clubs
          finish level on points. Nothing else in this mart is affected.
        tests: [not_null]
      - name: matches_with_xg
        description: How many of `played` have xG. The denominator behind every xG column here.
        tests: [not_null]
      - name: xg_for
        description: Summed expected goals across `matches_with_xg` matches — not across `played`.
      - name: xg_difference
        description: "`xg_for - xg_against`. The predictor question 1 of §8 weighs against points."
      - name: xg_for_per_match
        description: Per-match xG, dividing by `matches_with_xg` rather than `played` so a missing fixture does not read as a quiet match.
      - name: npxg_for
        description: |
          Non-penalty expected goals, as Understat reports it **per match**. This is
          the one place npxG is available without going to `fact_shots` — there is no
          non-penalty xG per *player* anywhere in Gold (§5 trap 8).
      - name: xpts
        description: Summed Understat expected points, across `matches_with_xpts` matches.
      - name: points_in_xpts_matches
        description: |
          Points earned in exactly the matches that have an xPTS. The honest left hand
          side of `points_minus_xpts`: comparing a full season of points against a
          partial season of xPTS would invent an overperformance out of a missing
          fixture.
      - name: points_minus_xpts
        description: |
          `points_in_xpts_matches - xpts`. Positive means the club took more points
          than its chances deserved. The headline of §8 question 1 — and a quantity
          that regresses towards zero, which that analysis has to account for rather
          than call skill.
      - name: ppda
        description: |
          Mean passes allowed per defensive action over `matches_with_ppda` matches.
          **Lower means more pressing** (§5 trap 12).
      - name: points_minus_xpts_rank
        description: |
          1 = furthest ahead of xPTS in this league-season. A rank is a metric, not
          formatting — it depends on which rows are in the population — so it is
          defined here rather than by sorting in the browser.
        tests: [not_null]
      - name: xg_difference_rank
        description: 1 = best xG difference in this league-season.
        tests: [not_null]
      - name: clubs_in_league
        description: The size of the population both ranks are against, so "4th" can be shown as "4th of 20".
        tests: [not_null]
      - name: gap_band
        description: |
          A plain-language reading of `points_minus_xpts`, from the `gap_level_points`
          (3) and `gap_wide_points` (8) vars. **Presentational, not a significance
          test:** analysis 02 found a gap of any size barely persists into the next
          half-season, and the dashboard says so beside the band. It exists so a
          reader who does not know what 13.9 means is told it is unusually wide.
        tests:
          - accepted_values:
              arguments:
                values: ["well ahead", "ahead", "level", "behind", "well behind"]
      - name: scheduled_per_team
        description: "`2 × (clubs in this league-season − 1)`: a full double round robin. Derived from the clubs present, never a hardcoded 38 or 34."
        tests: [not_null]
      - name: team_fixtures_complete
        description: Whether this club has played its full fixture list.
      - name: is_season_complete
        description: |
          Whether **every** club in this league-season has. The in-progress season is
          why this column exists: season totals are not comparable across a complete
          and a partial season, and the answer belongs here rather than in a notebook
          filter or a dashboard dropdown.
        tests: [not_null]

  - name: mart_team_form
    description: |
      **Grain: one club per counting match** (`team_key` × `match_key`), with rolling
      xG for and against over that club's last `form_window` matches.

      The dashboard's Team page draws this. Every row carries `form_window` so a
      chart states its window, and `window_matches` / `window_xg_matches` so it can
      tell a genuine dip from a short window at the start of a season or a fixture
      the sources never paired. Windows never cross a season or a competition.
    tests:
      - unique_combination:
          arguments:
            columns: [team_key, match_key]
    columns:
      - name: team_key
        tests: [not_null]
      - name: match_key
        tests: [not_null]
      - name: team_name
        tests: [not_null]
      - name: opponent_name
        description: The opposing club's conformed name, so a form chart can label its fixtures.
        tests: [not_null]
      - name: match_number
        description: Which match of the season this is for this club, 1-based, ordered by date then `match_key`.
        tests: [not_null]
      - name: form_window
        description: The number of matches the rolling columns cover — the `form_window` dbt var, carried so every chart can state it.
        tests: [not_null]
      - name: window_matches
        description: |
          How many matches are actually behind this row's rolling values: less than
          `form_window` for a club's first matches of a season.
        tests: [not_null]
      - name: window_xg_matches
        description: |
          How many of those have xG. `rolling_xg_for` averages only those, and is null
          when there are none — nulls are never averaged as zero (§5 trap 7).
        tests: [not_null]
      - name: rolling_xg_for
        description: Mean expected goals created over the window. Null when no match in the window has xG.
      - name: rolling_xg_against
        description: Mean expected goals conceded over the window.
      - name: rolling_points
        description: Mean points over the window — the results line that sits beside the xG lines.
      - name: points
        description: Points from this single match, so the chart can show results alongside the trend.
        tests: [not_null]

  - name: mart_player_season
    description: |
      **Grain: one player per season** (`understat_player_id` × `season`) — totals,
      per-90s, and the finishing measures behind §8 question 2.

      **Not player × season × club**, which is what CLAUDE.md §6 originally
      planned. The reasoning behind §5 trap 1 applies to a club split just as it
      does to a key split: 94 player-seasons in 2024/25 and 92 in 2025/26 span two
      clubs while clearing the minutes floor, and at club grain each half is a
      shorter season that often clears no floor at all. "Does this player finish
      well?" needs the whole season. The club survives as `primary_team_name` (most
      minutes) plus a `clubs` count, and `int_player_matches` keeps the per-club
      detail.

      Reconciles against the real world: 2024/25 reads Mbappé 31, Salah 29 with 18
      assists, Kane 26 — and Retegui 25, which is the number you lose to 24 by
      applying the league-table filter to player totals (§5 trap 13).

      **Use `np_goals_minus_npxg`, not `goals_minus_xg`,** for anything about
      finishing. Understat's per-player xG includes penalties (§5 trap 8), so the
      second measure mostly describes a player's penalty duty.
    tests:
      - unique_combination:
          arguments:
            columns: [understat_player_id, season]
    columns:
      - name: understat_player_id
        description: The durable player key — the grain, and the reason a transferred player is one row rather than two (§5 trap 1).
        tests: [not_null]
      - name: player_name
        description: From the player's current `dim_players` version. Exactly one version per player is current (4,048 of 4,048), so this cannot fan out the grain.
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: primary_team_key
        description: The club where the player logged the most minutes that season; ties break on `team_key` so the choice is stable between runs.
        tests: [not_null]
      - name: clubs
        description: How many clubs the player appeared for that season. Greater than 1 for roughly 3% of rows — read `primary_team_name` with that in mind.
        tests: [not_null]
      - name: competition_code
        description: |
          The league of the primary club. Null only when that club has no counting
          matches in the season — which happens when every appearance the player
          made was on a match the snapshot cannot resolve. Zero rows today;
          `assert_missing_leagues_are_explained` holds the nulls to that reason
          rather than asserting there are none, because the CI fixture has one on
          purpose (§5 trap 4).
        tests:
          - accepted_values:
              arguments:
                values: ["PL", "PD", "BL1", "SA", "FL1"]
      - name: minutes
        description: Total minutes. The denominator of every per-90 below, and what the minutes floor is applied to.
        tests: [not_null]
      - name: goals
        description: All goals, penalties included. Own goals are **not** here — they are in `own_goals`.
        tests: [not_null]
      - name: np_goals
        description: Non-penalty goals, counted from the shots.
        tests: [not_null]
      - name: npxg
        description: Non-penalty expected goals, from `int_shots`. The only route to npxG per player — Gold has none (§5 trap 8).
        tests: [not_null]
      - name: goals_minus_xg
        description: |
          Finishing **including penalties**, and therefore mostly a statement about
          penalty duty for anyone who takes them. Kept for comparison; not the
          measure any conclusion should rest on.
      - name: np_goals_minus_npxg
        description: |
          Non-penalty goals minus non-penalty expected goals: the finishing measure
          §8 question 2 tests for repeatability. Positive means more goals than the
          chances were worth. Expect it to regress heavily towards zero — that is
          the finding, not a flaw.
      - name: npxg_per_90
        description: Non-penalty expected goals per 90 — chance *volume*, the thing finishing is usually contrasted with.
      - name: npxg_per_90_percentile
        description: |
          Where this player's npxG per 90 sits **among players in the same season and
          the same league who clear the minutes floor** — 0 lowest, 100 highest.

          The population is the whole point. Comparing a Bundesliga forward against
          every squad player in Europe would flatter him, and comparing across seasons
          would move the yardstick. Null below the floor, rather than a percentile
          against a population the player is not part of.
      - name: np_goals_per_90_percentile
        description: As `npxg_per_90_percentile`, for non-penalty goals per 90.
      - name: xa_per_90_percentile
        description: As `npxg_per_90_percentile`, for expected assists per 90.
      - name: shots_per_90_percentile
        description: As `npxg_per_90_percentile`, for shots per 90.
      - name: min_minutes
        description: The `min_minutes` dbt var in force when this was built, carried so a chart can state its threshold without hardcoding it again.
        tests: [not_null]
      - name: meets_minutes_floor
        description: Whether `minutes >= min_minutes`. 3,160 of 7,467 player-seasons clear the default 900.
        tests: [not_null]

  - name: mart_shots
    description: |
      **Grain: one row per distinct shot** (`shot_key`) with player, team, match and
      season attached — the shot map on the dashboard and §8 question 4 read this.

      93,988 rows: Gold's 94,034 less the 46 duplicates of §5 trap 14, removed
      upstream in `int_shots`. Coordinates stay in Understat's [0, 1] space and are
      **not** rescaled (§5 trap 10): higher `x` is nearer the goal being attacked,
      `y = 0.5` is the middle, the penalty spot is exactly `(0.885, 0.5)`.
    tests:
      - unique_combination:
          arguments:
            columns: [shot_key]
    columns:
      - name: shot_key
        tests: [unique, not_null]
      - name: player_name
        tests: [not_null]
      - name: team_name
        description: The club the shot was taken for, from the shot's own `team_key` — never the player's current club (§5 trap 2).
        tests: [not_null]
      - name: season
        description: |
          From the shot's match. Null only when no match in the snapshot carries
          the shot's `understat_match_id` — zero rows today, one in the CI fixture
          by design (§5 trap 4).
      - name: competition_code
        tests:
          - accepted_values:
              arguments:
                values: ["PL", "PD", "BL1", "SA", "FL1"]
      - name: x
        description: Understat's normalized distance along the pitch, [0, 1]. Higher is closer to the goal being attacked.
        tests: [not_null]
      - name: y
        description: Understat's normalized position across the pitch, [0, 1]; 0.5 is the middle.
        tests: [not_null]
      - name: is_goal
        description: "`result = 'Goal'`, which correctly excludes own goals (§5 trap 11)."
        tests: [not_null]
      - name: is_penalty
        description: Penalties sit on one point of the pitch and average 0.756 xG — the check that confirms the coordinate orientation (§5 trap 10).
        tests: [not_null]
      - name: result
        tests:
          - accepted_values:
              arguments:
                values: ["Goal", "OwnGoal", "MissedShots", "BlockedShot", "SavedShot", "ShotOnPost"]

  - name: mart_team_season_half
    description: |
      **Grain: one club per half-season** (`team_key` × `season` ×
      `competition_code` × `season_half`) — the same league table as
      `mart_team_season`, cut in two.

      Built for §8 question 1, which asks whether a points-over-xPTS gap persists:
      that needs the gap measured over one stretch of matches and compared with
      what the next stretch did. It is a mart rather than a notebook CTE because
      the honest `points − xPTS` needs the coverage discipline of §5 trap 7, and
      that calculation may not exist in two places.

      **Halves are by match number, not by date.** Clubs play the same number of
      matches but not on the same days, so a calendar cut-off would put a different
      number of fixtures either side for different clubs. By match number each half
      is exactly half a fixture list.
    tests:
      - unique_combination:
          arguments:
            columns: [team_key, season, competition_code, season_half]
    columns:
      - name: team_key
        tests: [not_null]
      - name: team_name
        tests: [not_null]
      - name: season_half
        description: 1 or 2. Match numbers 1..N/2 and N/2+1..N, where N is the club's full fixture list.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: is_season_complete
        description: |
          Whether every club in the league-season finished its fixture list. **Only
          complete seasons halve meaningfully** — an in-progress season still
          produces rows, and its second half is partial — so any comparison of the
          two halves filters on this.
        tests: [not_null]
      - name: played
        description: Matches in this half. Equal to `scheduled_per_team / 2` in a complete season.
        tests: [not_null]
      - name: points_minus_xpts
        description: |
          Points over expected points **within this half**, counted over the matches
          that carry an xPTS. The quantity question 1 tests for persistence.
      - name: xg_difference_per_match
        description: xG created minus conceded, per match with xG — the rival predictor question 1 weighs against points.
