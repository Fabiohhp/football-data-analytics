[project]
name = "football-analytics"
version = "0.1.0"
description = "Part 2 — Analytics & BI over the Gold star schema built by football-data-engineering"
requires-python = ">=3.11"

dependencies = [
    # Snapshot export and the analytical store. `duckdb` carries the `postgres`
    # extension used to read Part 1's warehouse READ_ONLY.
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    # Metrics layer.
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    # Analysis.
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "mplsoccer>=1.4",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.8",
    "pytest>=8.3",
    # CI re-executes every notebook to prove the committed outputs still run.
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_analytics"]

# Line length and rule selection match Part 1, so the same habits carry over.
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
