<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Players · Big 5 Analytics</title>
<meta name="description" content="Per-90 player leaderboard with league percentiles and a minutes filter.">
<link rel="stylesheet" href="css/app.css">
<script>
  // Applied before first paint so the page never flashes the wrong theme. Dark is
  // the default; localStorage only ever holds an explicit choice made by the toggle.
  try {
    var stored = localStorage.getItem("theme");
    if (stored === "light" || stored === "dark") {
      document.documentElement.dataset.theme = stored;
    }
  } catch (e) { /* private browsing: fall back to the dark default */ }
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="shell">
  <aside class="rail">
    <div id="rail-top"></div>
    <div class="rail-section">
      <div class="rail-heading">Filters</div>
      <div class="ctl">
        <label class="ctl-label" for="season">Season</label>
        <span class="select"><select id="season"></select></span>
      </div>
      <div class="ctl">
        <span class="ctl-label" id="league-label">League</span>
        <div class="seg" id="league" role="group" aria-labelledby="league-label"></div>
      </div>
      <div class="ctl">
        <label class="ctl-label" for="minutes">Minimum minutes</label>
        <span class="slider">
          <input type="range" id="minutes" min="0" max="3000" step="90" value="900">
          <output id="minutes-out" for="minutes"></output>
        </span>
      </div>
    </div>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>

  <main class="canvas" id="main">
    <p class="kicker" id="kicker"></p>
    <h1 class="answer" id="answer"></h1>
    <div class="meaning" id="meaning"></div>
    <section class="guide" id="guide"></section>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title" id="board-title">Per-90 leaderboard</h2>
        <span class="section-note">Bars show the league percentile · click a column to sort</span>
      </div>
      <div class="panel">
        <div class="table-scroll" id="table-scroll">
          <table>
            <thead>
              <tr>
                <th class="name" scope="col">Player</th>
                <th class="c-optional" scope="col">Club</th>
                <th data-sort="minutes" scope="col">Min</th>
                <th data-sort="np_goals" scope="col">npG</th>
                <th data-sort="np_goals_per_90" scope="col">npG/90</th>
                <th data-sort="npxg_per_90" aria-sort="descending" scope="col">npxG/90</th>
                <th data-sort="xa_per_90" class="c-optional" scope="col">xA/90</th>
                <th data-sort="shots_per_90" class="c-optional" scope="col">Sh/90</th>
                <th data-sort="finishing" scope="col">npG − npxG</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="panel-foot" id="board-foot"></div>
      </div>
    </section>

    <footer class="foot" id="foot"></footer>
  </main>
</div>

<div class="tip" id="tip" role="tooltip" hidden></div>
<script type="module" src="js/players.js"></script>
</body>
</html>
